<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>反季节抢卡系统</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section id="loginPage" class="page login-page active" aria-labelledby="loginTitle">
        <form id="loginForm" class="login-panel">
          <p class="eyebrow">Concert Ticket Rush</p>
          <h1 id="loginTitle">反季节抢卡系统</h1>
          <p class="login-copy">QQ号为唯一凭证，昵称可随意修改。抢到的卡会自动进入个人信息页，请凭截图付款领取。</p>

          <label>
            QQ号
            <input id="qqInput" type="text" placeholder="请输入QQ号" required />
          </label>
          <label>
            ID
            <input id="idInput" type="text" placeholder="QQ昵称或圈名" required />
          </label>
          <button type="submit" class="primary-action">登录并开始抢卡</button>
        </form>
      </section>

      <section id="ticketPage" class="page ticket-page" aria-labelledby="ticketTitle">
        <header class="topbar">
          <div>
            <p class="eyebrow">Live Now</p>
            <h1 id="ticketTitle">抢卡大厅</h1>
          </div>
          <nav class="nav-actions" aria-label="页面导航">
            <button class="nav-button active" type="button" data-view="tickets">抢卡</button>
            <button class="nav-button" type="button" data-view="profile">我的</button>
            <button id="adminNavButton" class="nav-button admin-only" type="button" data-view="admin">管理</button>
          </nav>
        </header>

        <div id="ticketsView" class="content-view active">
          <section id="heroBand" class="hero-band" aria-label="抢卡状态">
            <div>
              <p>今日热抢</p>
              <h2 id="rushTitle">？？？开卡</h2>
            </div>
            <div class="rush-status">
              <span id="rushLabel">距离开抢</span>
              <strong id="countdownText">--:--:--</strong>
              <small id="grabSummary">已抢 0 张</small>
            </div>
          </section>

          <section id="ticketList" class="ticket-list" aria-label="卡片列表"></section>
        </div>

        <div id="profileView" class="content-view">
          <section class="profile-layout">
            <aside class="profile-card">
              <div class="avatar" id="avatarInitial">星</div>
              <h2 id="profileName">未登录</h2>
              <p id="profileQq">--</p>
              <button type="button" id="logoutButton" class="secondary-action">退出登录</button>
            </aside>

            <section class="owned-tickets" aria-labelledby="ownedTitle">
              <div class="section-heading">
                <div>
                  <p class="eyebrow">My Tickets</p>
                  <h2 id="ownedTitle">我抢到的卡</h2>
                </div>
                <span id="ownedCount">0 张</span>
              </div>
              <div id="ownedTicketList" class="owned-ticket-list"></div>
            </section>
          </section>
        </div>

        <div id="adminView" class="content-view">
          <section class="admin-layout" aria-labelledby="adminTitle">
            <div class="section-heading">
              <div>
                <p class="eyebrow">Admin</p>
                <h2 id="adminTitle">管理员页面</h2>
              </div>
              <button type="button" id="resetAdminButton" class="secondary-action">恢复默认</button>
            </div>

            <form id="settingsForm" class="admin-panel">
              <label>
                首页主标题
                <input id="adminRushTitle" type="text" required />
              </label>
              <label>
                开抢时间
                <input id="adminStartTime" type="datetime-local" required />
              </label>
              <label>
                单账号限额
                <input id="adminMaxCards" type="number" min="0" step="1" required />
              </label>
              <label class="wide-field">
                首页背景图
                <input id="adminHeroImage" type="file" accept="image/*" />
              </label>
              <button type="submit" class="primary-action">保存开抢设置</button>
            </form>

            <form id="createCardForm" class="admin-create-card">
              <div class="section-heading">
                <div>
                  <p class="eyebrow">Create</p>
                  <h2>添加新卡</h2>
                </div>
              </div>
              <div class="admin-fields">
                <label>卡名<input name="title" type="text" required /></label>
                <label>价格<input name="price" type="text" required /></label>
                <label>地点<input name="venue" type="text" required /></label>
                <label>演出时间<input name="time" type="text" required /></label>
                <label>卡数限制<input name="quota" type="number" min="0" step="1" value="10" required /></label>
                <label class="wide-field">介绍<input name="description" type="text" required /></label>
                <label class="wide-field">上传预览图<input name="image" type="file" accept="image/*" multiple /></label>
                <button type="submit" class="grab-button">添加这张卡</button>
              </div>
            </form>

            <div id="adminTicketList" class="admin-ticket-list"></div>
            <section class="admin-claims-panel" aria-labelledby="claimsTitle">
              <div class="section-heading">
                <div>
                  <p class="eyebrow">Claims</p>
                  <h2 id="claimsTitle">抢到卡的人</h2>
                </div>
                <span id="claimsCount">0 条</span>
              </div>
              <div id="adminClaimsList" class="admin-claims-list"></div>
            </section>
          </section>
        </div>
      </section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="script.js"></script>
  </body>
</html>
